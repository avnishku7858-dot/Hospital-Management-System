</style></head><body>
<nav id="nav"><h1>✚ MediCare HMS</h1></nav>
<main id="m"></main>
<script>
const S={patients:[{id:101,name:"Ravi Kumar",age:45,dept:"Cardiology",st:"Admitted"},{id:102,name:"Anita Sinha",age:32,dept:"Gynecology",st:"Outpatient"},{id:103,name:"Mohan Das",age:67,dept:"Orthopedics",st:"Admitted"},{id:104,name:"Priya Singh",age:24,dept:"General",st:"Discharged"}],
doctors:[{n:"Dr. A. Verma",d:"Cardiology",on:true},{n:"Dr. S. Rao",d:"Orthopedics",on:true},{n:"Dr. N. Gupta",d:"Gynecology",on:false},{n:"Dr. K. Jha",d:"General",on:true}],
appts:[{p:"Anita Sinha",d:"Dr. N. Gupta",t:"2026-10-15 10:30",st:"Scheduled"},{p:"Ravi Kumar",d:"Dr. A. Verma",t:"2026-10-15 11:15",st:"Scheduled"}],
bills:[{p:"Ravi Kumar",a:18500,st:"Pending"},{p:"Priya Singh",a:2300,st:"Paid"},{p:"Mohan Das",a:42000,st:"Pending"}]};
const T=["Dashboard","Patients","Wards","Appointments","Doctors","Billing","Admin"];let cur="Dashboard";
const $=(h)=>h,tag=(s)=>`<span class="t ${s=="Pending"||s=="Outpatient"?"w":s=="Cancelled"?"r":""}">${s}</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const depts=["Cardiology","Orthopedics","Gynecology","General","Pediatrics"];
function nav(){document.getElementById("nav").innerHTML='<h1>✚ MediCare HMS</h1>'+tabs().map(t=>`<button class="${t==cur?"on":""}" onclick="go('${t}')">${t}</button>`).join("")+`<div style="margin:14px 8px 0;font-size:12px;color:var(--mu)">Signed in as<br><b style="color:var(--tx)">${R||""} ${U?"· "+esc(U):""}</b><button class="s" style="margin-top:6px;width:100%" onclick="logout()">Switch portal</button></div>`}
function go(t){cur=t;nav();render()}
function tbl(h,rows){return `<div class="w"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div>`}
function render(){const m=document.getElementById("m");let h=`<h2>${cur}</h2>`;
if(cur=="Dashboard"){const adm=S.patients.filter(p=>p.st=="Admitted").length,pend=S.bills.filter(b=>b.st=="Pending").reduce((a,b)=>a+b.a,0);
const by=depts.map(d=>[d,S.patients.filter(p=>p.dept==d).length]),mx=Math.max(1,...by.map(x=>x[1]));
h+=`<div class="g"><div class="c k" onclick="go('Patients')"><small>Total patients</small><b>${S.patients.length}</b></div><div class="c k" onclick="go('Wards')"><small>Admitted now</small><b>${adm}</b></div><div class="c k" onclick="go('Appointments')"><small>Today's appointments</small><b>${S.appts.filter(a=>a.st=="Scheduled").length}</b></div><div class="c k" onclick="go('Billing')"><small>Pending bills</small><b>₹${pend.toLocaleString("en-IN")}</b></div></div>
<div class="row"><div class="c"><small>Patients by department</small><div class="bar" style="margin-bottom:26px">${by.map(([d,n])=>`<div style="height:${n/mx*100}%"><span>${d.slice(0,5)} ${n}</span></div>`).join("")}</div></div>
<div class="c"><small>Doctors on duty</small>${S.doctors.map(d=>`<div style="margin-top:8px">${esc(d.n)} ${d.on?'<span class="t">On</span>':'<span class="t r">Off</span>'}</div>`).join("")}</div></div>`}
if(cur=="Patients"){h+=`<form onsubmit="addP(event)"><input id="pn" placeholder="Patient name" required><input id="pa" type="number" min="0" max="120" placeholder="Age" required style="width:90px"><select id="pd">${depts.map(d=>`<option>${d}</option>`).join("")}</select><button class="p">Register</button></form>`+
`<div style="display:flex;gap:8px;margin-bottom:12px"><input id="q" placeholder="Search name or department…" value="${esc(Q)}" oninput="Q=this.value;pt()" style="flex:1"><select onchange="F=this.value;pt()">${["All","Outpatient","Admitted","Discharged"].map(x=>`<option ${x==F?"selected":""}>${x}</option>`).join("")}</select></div><div id="pt">${ptb()}</div>`}
if(cur=="Appointments"){h+=`<form onsubmit="addA(event)"><select id="ap">${S.patients.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select><select id="ad">${S.doctors.filter(d=>d.on).map(d=>`<option>${d.n}</option>`).join("")}</select><input id="at" type="datetime-local" required><button class="p">Book</button></form>`+
tbl(["Patient","Doctor","Time","Status",""],S.appts.map((a,i)=>[esc(a.p),a.d,a.t.replace("T"," "),tag(a.st),a.st=="Scheduled"?`<button class="s" onclick="canc(${i})">Cancel</button>`:""]))}
if(cur=="Doctors"){h+=tbl(["Name","Department","Duty"],S.doctors.map((d,i)=>[d.n,d.d,`<button class="s" onclick="duty(${i})">${d.on?"On duty ✓":"Off duty"}</button>`]))}
if(cur=="Billing"){h+=tbl(["Patient","Amount","Status",""],S.bills.map((b,i)=>[esc(b.p),"₹"+b.a.toLocaleString("en-IN"),tag(b.st),(b.st=="Pending"?`<button class="s" onclick="pay(${i})">Mark paid</button> `:"")+`<button class="s" onclick="rcpt(${i})">🧾 Receipt</button>`]))}
if(cur=="Wards")h+=wards();if(cur=="Admin")h+=admin();m.innerHTML=h}
function addP(e){e.preventDefault();S.patients.push({id:100+S.patients.length+1,name:pn.value,age:+pa.value,dept:pd.value,st:"Outpatient"});toast("Patient registered");render()}
function tog(i){const o=["Outpatient","Admitted","Discharged"],p=S.patients[i];setSt(p.id,o[(o.indexOf(p.st)+1)%3])}
function addA(e){e.preventDefault();S.appts.push({p:ap.value,d:ad.value,t:at.value,st:"Scheduled"});toast("Appointment booked");render()}
function canc(i){S.appts[i].st="Cancelled";toast("Appointment cancelled");render()}
function duty(i){S.doctors[i].on=!S.doctors[i].on;render()}
function pay(i){S.bills[i].st="Paid";toast("Payment recorded");render()}
let Q="",F="All",VT=null;
S.beds=Array.from({length:12},(_,i)=>({n:(i<6?"A":"B")+(i%6+1),pid:null}));S.beds[0].pid=101;S.beds[1].pid=103;
S.notes={101:["Chest pain, ECG ordered"],103:["Post-op day 2, physio started"]};
const pf=id=>S.patients.find(p=>p.id==id);
function toast(m){S.log.unshift(new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+" · "+m);const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function modal(h){closeM();const o=document.createElement("div");o.id="ov";o.className="ov";o.onclick=e=>{if(e.target==o)closeM()};o.innerHTML=`<div class="md">${h}</div>`;document.body.appendChild(o)}
function closeM(){clearInterval(VT);const o=document.getElementById("ov");if(o)o.remove()}
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeM()});
function ptb(){const q=Q.toLowerCase(),r=S.patients.filter(p=>(F=="All"||p.st==F)&&(p.name+p.dept).toLowerCase().includes(q));if(!r.length)return '<div class="c"><small>No patients match.</small></div>';return tbl(["ID","Name","Age","Dept","Status",""],r.map(p=>[p.id,`<b style="cursor:pointer;color:var(--ac)" onclick="det(${p.id})">${esc(p.name)}</b>`,p.age,p.dept,tag(p.st),`<button class="s" onclick="tog(${S.patients.indexOf(p)})">Change status</button>`]))}
function pt(){document.getElementById("pt").innerHTML=ptb()}
function nl(id){return (S.notes[id]||[]).map(n=>`<div class="c" style="margin-top:6px;padding:8px 10px">${esc(n)}</div>`).join("")||"<small>No notes yet</small>"}
function addN(e,id){e.preventDefault();if(!can("Add notes"))return toast("Notes are disabled by the admin");(S.notes[id]=S.notes[id]||[]).push(nt.value);nt.value="";document.getElementById("nl").innerHTML=nl(id);toast("Note added")}
function setSt(id,st){const p=pf(id);p.st=st;if(st!="Admitted")S.beds.forEach(b=>{if(b.pid==id)b.pid=null});toast(p.name+": "+st);render()}
function det(id){const p=pf(id),bd=S.beds.find(b=>b.pid==id);
modal(`<h3>${esc(p.name)}</h3><small style="color:var(--mu)">#${p.id} · ${p.age} yrs · ${p.dept}${bd?" · Bed "+bd.n:""}</small><div class="g" style="margin:14px 0"><div class="c"><small>Heart rate</small><b><span id="hr">72</span> <span class="hb">♥</span></b></div><div class="c"><small>Temp °C</small><b id="tp">36.8</b></div><div class="c"><small>SpO₂</small><b id="ox">98%</b></div></div><div style="margin-bottom:12px">Status: ${["Outpatient","Admitted","Discharged"].map(s=>`<button class="s" style="${s==p.st?"background:var(--ac);color:#fff":""}" onclick="setSt(${id},'${s}');det(${id})">${s}</button>`).join(" ")}</div><b>Notes</b><div id="nl">${nl(id)}</div><form onsubmit="addN(event,${id})" style="margin:8px 0"><input id="nt" placeholder="Add clinical note…" style="flex:1" required><button class="p">Add</button></form><button class="s" onclick="closeM()">Close</button>`);
VT=setInterval(()=>{hr.textContent=60+Math.round(Math.random()*35);tp.textContent=(36.4+Math.random()*1.2).toFixed(1);ox.textContent=(95+Math.round(Math.random()*4))+"%"},1500)}
function wards(){const f=S.beds.filter(b=>!b.pid).length;return `<p style="color:var(--mu)">${S.beds.length-f} occupied · ${f} free. Click a bed to assign or discharge.</p><div class="g">${S.beds.map((b,i)=>{const p=b.pid&&pf(b.pid);return `<div class="c bed ${p?"occ":""}" onclick="bed(${i})"><small>Bed ${b.n}</small><b style="font-size:16px">${p?esc(p.name):"Free"}</b></div>`}).join("")}</div>`}
function bed(i){const b=S.beds[i];if(b.pid){const p=pf(b.pid);modal(`<h3>Bed ${b.n}: ${esc(p.name)}</h3><p><button class="p" onclick="det(${p.id})">Open record</button> <button class="s" onclick="setSt(${p.id},'Discharged');closeM()">Discharge</button></p>`)}else{const ps=S.patients.filter(p=>!S.beds.some(x=>x.pid==p.id)&&p.st!="Discharged");modal(`<h3>Assign Bed ${b.n}</h3>`+(ps.length?ps.map(p=>`<div><button class="s" style="margin:4px 0" onclick="assign(${i},${p.id})">${esc(p.name)} · ${p.dept}</button></div>`).join(""):"<small>No unassigned patients</small>"))}}
function assign(i,id){S.beds[i].pid=id;pf(id).st="Admitted";closeM();toast("Bed assigned");render()}
let R=null,U=null;S.log=[];
const FT={Doctor:["View patients","Add notes","Complete visits"],Patient:["Book appointments","Pay bills","View records"]};S.perm={Doctor:[...FT.Doctor],Patient:[...FT.Patient]};
function allowed(t){return R=="Admin"||(t!="Admin"&&S.perm[R].includes(t))}
function setR(r){R=r;if(!allowed(cur))cur="Dashboard";toast("Signed in as "+r);nav();render()}
function perm(r,s,on){S.perm[r]=S.perm[r].filter(x=>x!=s);if(on)S.perm[r].push(s);toast(r+": "+s+(on?" enabled":" disabled"))}
function aDoc(e){e.preventDefault();S.doctors.push({n:dn.value,d:dd.value,on:true});toast("Doctor added");render()}
function delDoc(i){toast("Removed "+S.doctors[i].n);S.doctors.splice(i,1);render()}
function aDept(e){e.preventDefault();const v=dpn.value.trim();if(depts.includes(v))return toast("Department exists");depts.push(v);toast("Department added: "+v);render()}
function delDept(i){const d=depts[i];if(S.patients.some(p=>p.dept==d)||S.doctors.some(x=>x.d==d))return toast(d+" is in use");depts.splice(i,1);toast("Removed "+d);render()}
function delPat(id){const p=pf(id);S.beds.forEach(b=>{if(b.pid==id)b.pid=null});S.appts=S.appts.filter(a=>a.p!=p.name);S.bills=S.bills.filter(b=>b.p!=p.name);S.patients=S.patients.filter(x=>x.id!=id);toast("Deleted patient "+p.name);render()}
function delAppt(i){toast("Appointment deleted");S.appts.splice(i,1);render()}
function aBill(e){e.preventDefault();S.bills.push({p:bp.value,a:+ba.value,st:"Pending"});toast("Bill added");render()}
function delBill(i){toast("Bill deleted");S.bills.splice(i,1);render()}
function addBed(e){e.preventDefault();S.beds.push({n:"N"+(S.beds.length+1),pid:null});toast("Bed added");render()}
